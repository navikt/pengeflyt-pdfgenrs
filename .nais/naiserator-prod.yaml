apiVersion: "nais.io/v1alpha1"
kind: "Application"
metadata:
  name: pengeflyt-pdfgenrs
  namespace: oppgjorsrapporter
  labels:
    team: oppgjorsrapporter
spec:
  observability:
    autoInstrumentation:
      enabled: true
      runtime: sdk
  image: {{ image }}
  replicas:
    min: 2
    max: 4
    scalingStrategy:
      cpu:
        thresholdPercentage: 90
  liveness:
    path: /internal/is_alive
  readiness:
    path: /internal/is_ready
  startup:
    path: /internal/is_alive
    initialDelay: 10
  prometheus:
    enabled: true
    path: /internal/metrics
  resources:
    limits:
      memory: 2048Mi
    requests:
      cpu: 10m
      memory: 128Mi
  accessPolicy:
    inbound:
      rules:
        - application: sokos-oppgjorsrapporter
  env:
    # Øk grensen for hvor store (JSON-)payloads pdfgenrs vil ta imot fra default (2MiB) til 8 MiB, slik at våre største
    # rapport-bestillinger lar seg prosessere.
    - name: REQUEST_BODY_LIMIT_BYTES
      value: "8388608"
    - name: COMPILE_TIMEOUT_SECONDS
      value: "60"
